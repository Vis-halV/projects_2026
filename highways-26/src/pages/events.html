<!-- EVENT DETAILS DIALOG -->
<div
  id="event-dialog-overlay"

  <div
    id="event-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="event-dialog-title"
    class="w-[min(92vw,560px)] max-h-[80vh] overflow-auto bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-6 md:p-8 text-white shadow-lg">

        type="button"
